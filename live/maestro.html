<html lang="pt-BR"><head>

<title>CT-MED LIVE | Maestro v2</title>
<style>
:root{color-scheme:dark;--bg:#070e1a;--panel:#111f34;--panel2:#172941;--line:#2d425d;--text:#eff5ff;--muted:#aabbd3;--gold:#f5a524;--blue:#72b4ff;--green:#80dfac}
*{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(ellipse at 0 0,#16324e 0%,transparent 40%),#070e1a;font:15px/1.56 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}button,a{font:inherit}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button{cursor:pointer;border:1px solid var(--line);border-radius:11px;background:#1b304b;color:var(--text);padding:10px 13px;font-weight:700}button:hover:not(:disabled){filter:brightness(1.2)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--gold);color:#101923;border-color:var(--gold)}.danger{background:#4b2a2a}.green{color:var(--green)}
.shell{max-width:1620px;margin:0 auto;padding:22px clamp(14px,3vw,38px) 70px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.brand{font-size:19px;font-weight:900;letter-spacing:.01em}.brand b{color:var(--gold)}.overline{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.toplinks{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.tiny{font-size:12px;color:var(--muted)}.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid #3a5974;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700}.chip.ready{color:var(--green);border-color:#377a61}.chip.warn{color:#ffc778;border-color:#77552a}
.headline{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:25px 0}.headline h1{font-size:clamp(27px,3.6vw,44px);line-height:1.08;margin:7px 0}.headline p{color:var(--muted);margin:5px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar .active{background:#355476;border-color:#83a3c6}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 14px 34px rgba(0,0,0,.11)}.sidebar{position:sticky;top:18px}.sidebar h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.navitem{display:flex;width:100%;text-align:left;gap:10px;align-items:center;justify-content:space-between;padding:12px;margin:5px 0;border:1px solid transparent;background:transparent;font-weight:600}.navitem.active{background:#263e59;border-color:#537aa1}.navitem small{color:#a9bcd2}.number{color:var(--gold);font-size:12px;min-width:18px}
.rule{height:1px;background:var(--line);margin:16px 0}.reader .eyebrow{color:var(--gold);font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.14em}.reader h2{font-size:clamp(24px,3vw,37px);line-height:1.15;margin:9px 0}.reader .intro{color:var(--muted);margin-top:0}.navbuttons{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:15px}.navbuttons button{min-width:106px}.script{background:#0b1727;padding:24px clamp(15px,3vw,35px);border:1px solid #253f5b;border-radius:15px;line-height:1.78;overflow-wrap:anywhere;font-size:16px}.script h2,.script h3,.script h4{line-height:1.3;margin:1.5em 0 .55em;color:#f8fafc}.script h2{font-size:22px;color:#ffc16b}.script h3{font-size:18px}.script h4{font-size:16px}.script p{margin:.65em 0;white-space:pre-wrap}.script ul{padding-left:22px;margin:8px 0 18px}.script li{margin:6px 0}.script blockquote{border-left:3px solid var(--gold);background:#142842;margin:18px 0;padding:12px 17px;color:#dce8f6;border-radius:0 8px 8px 0}.script hr{border:0;border-top:1px solid var(--line);margin:22px 0}.script code{font-size:14px;color:#c7ddff}.script table{width:100%;border-collapse:collapse;font-size:13px;margin:18px 0;display:block;overflow-x:auto}.script td,.script th{padding:8px 10px;border:1px solid #344e70;text-align:left}
.notice{background:#222f41;border-left:3px solid var(--gold);padding:13px 16px;margin:15px 0;border-radius:8px;color:#e2e9f2}.notice.warn{border-left-color:#e47b74}.notice.good{border-left-color:var(--green)}.boxrow{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.details{color:var(--muted);font-size:13px;margin-top:12px}
#feedback{min-height:20px;color:var(--gold)}.footer{margin-top:16px;color:var(--muted);font-size:12px}.loading{max-width:820px;margin:60px auto;padding:26px}
@media(max-width:880px){.layout{grid-template-columns:1fr}.sidebar{position:static}.sidebar h3{display:none}.sidebar .navitems{display:flex;gap:8px;overflow:auto}.navitem{min-width:170px}.headline{flex-direction:column}.script{font-size:15px}}@media print{body{background:white;color:black}.sidebar,.top,.toolbar,.navbuttons,.footer{display:none}.layout{display:block}.panel,.script{border:0;background:white;color:black;box-shadow:none}.script h2{color:black}}
</style>
