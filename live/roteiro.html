d:#182d47}.tree-step.active{background:#203b5a;border-left-color:var(--gold);color:#fff}.tree-step .step-state{font-size:10px;color:#8aa2bd}.tree-step .step-state.ok{color:var(--green)}.tree-more{border:0;background:transparent;border-radius:6px;padding:0;color:#8fa8c4;font-size:16px}.tree-more:hover{background:#203b5a;color:#fff}.tree-menu{position:absolute;z-index:30;right:0;top:100%;min-width:170px;background:#0d1b2e;border:1px solid #385675;border-radius:10px;padding:5px;box-shadow:0 14px 34px #0008}.tree-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;font-size:11px}.tree-menu button:hover{background:#203b5a}.tree-menu button.danger{color:#ffb1aa}.tree-add{margin:5px 0 2px 27px;padding:7px 9px;font-size:11px;background:#12253d;border-color:#2e4c6c}.divider{height:1px;background:var(--line);margin:14px 0}.details{color:var(--muted);font-size:12px;margin:8px 0}.editor-shell{min-width:0}.editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:5px}.editor-head h2{font-size:clamp(22px,2.4vw,32px);margin:2px 0}.editor-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 -18px 18px;padding:0 18px}.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:10px 12px;color:var(--muted);font-size:12px}.tab.active{color:#fff;border-bottom-color:var(--gold)}.tabpane[hidden]{display:none}.stepgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.78fr);gap:18px}.field{display:block;margin:12px 0}.field > span{display:block;font-size:12px;font-weight:750;color:#d1dff0;margin-bottom:6px}.field input,.field textarea,.field select{display:block;border:1px solid #415c7b;background:#0b1a2e;color:white;border-radius:9px;padding:12px;width:100%;min-width:0}.f
