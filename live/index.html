<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>CT-MED LIVE STUDIO — Online</title><style>
:root{color-scheme:dark;--bg:#07101c;--card:#122238;--border:#273c58;--text:#f4f8fd;--muted:#a8b9d0;--orange:#f5a524;--blue:#69a9ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#17304d,transparent 40%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}

label{display:block;font-weight:700;margin:12px 0 6px}input{display:block;width:100%;padding:13px 15px;border-radius:11px;border:1px solid #3b506e;background:#0b1727;color:var(--text);font-size:15px}
.note{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,.button{background:#243957;border:1px solid #415779;color:white;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none}button:hover,.button:hover{filter:brightness(1.16)}.primary{background:var(--orange);color:#111827;border-color:var(--orange)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.role{display:block;min-height:115px;text-decoration:none;background:#0c1b2d;border:1px solid var(--border);padding:17px;border-radius:14px}.role:hover{border-color:var(--orange)}.role strong{display:block;color:white;font-size:17px}.role span{color:var(--muted);font-size:13px}.step{margin:13px 0;color:var(--muted)}code{color:#b8d8ff;background:#081321;padding:3px 6px;border-radius:6px}

@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}main{padding:25px 16px}}
