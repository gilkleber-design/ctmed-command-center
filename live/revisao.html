<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CT-MED LIVE · Sala de construção</title>
<link rel="stylesheet" href="./debate.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script defer src="./debate.js"></script>
</head>
<body>
<header class="topbar">
 <div class="logo">CT-MED <span>/ LIVE · Sala de construção</span></div>
 <nav class="top-links">
  <span id="conn">● Conectando</span>
  <a href="../">Command Center ↗</a>
  <a href="./revisao-legado.html">Editor anterior ↗</a>
  <a href="./?view=maestro">Maestro ↗</a>
 </nav>
</header>
<div class="shell">
 <aside class="left">
  <div class="eyebrow">SPRINT ISR · 05 NOV 2026</div>
  <h2>Construção coletiva</h2>
  <p class="identity" id="identity">Gil + Diego</p>
  <div id="nav"></div>
 </aside>
 <main class="main" id="page"><div class="card">Carregando propostas, debates e decisões...</div></main>
</div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
<dialog id="sectionDialog">
<form id="sectionForm">
<h2>Abrir uma nova seção</h2>
<p class="small">A seção começa em debate. Não muda as propostas individuais nem gera aprovação.</p>
<label for="sectionName">Título da seção</label>
<input id="sectionName" name="title" required minlength="4" maxlength="160" placeholder="Ex.: Caso 1 — insuficiência respiratória e choque">
<label for="sectionKind">Tipo</label>
<select id="sectionKind"><option value="topic">Seção de planejamento</option><option value="case">Caso clínico</option></select>
<div class="form-actions"><button type="submit" class="primary">Criar seção</button><button id="cancelSection" type="button" class="secondary">Cancelar</button></div>
</form>
</dialog>
</body>
</html>
